apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: flask-monitor
  namespace: monitoring
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
      - project-manager
  selector:
    matchLabels:
      app: flask-api
  endpoints:
    - port: http
      path: /metrics
      interval: 15s